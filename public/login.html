<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; font:14px/1.45 system-ui,Segoe UI,Arial,sans-serif; background:#f4f5f9; color:#1c1f4f; }
  form { width:min(340px, calc(100vw - 32px)); background:#fff; border:1px solid #dfe2ec; border-radius:12px; padding:24px; }
  h1 { font-size:18px; margin:0 0 4px; }
  p { margin:0 0 16px; color:#6b6f99; font-size:13px; }
  input { width:100%; padding:10px; border:1px solid #dfe2ec; border-radius:8px; font:inherit; }
  button { width:100%; margin-top:12px; padding:10px; background:#4f46e5; color:#fff; border:0; border-radius:8px; font:inherit; font-weight:600; cursor:pointer; }
  button:disabled { opacity:.5; }
  #err { margin-top:12px; color:#8a1111; font-size:13px; min-height:18px; }
</style>
</head>
<body>
<form id="f">
  <h1>HR Trade and Tourism</h1>
  <p>Enter the password to open the booking agent.</p>
  <input id="p" type="password" placeholder="Password" autocomplete="current-password" autofocus required>
  <button id="b">Sign in</button>
  <div id="err"></div>
</form>
<script>
document.getElementById('f').onsubmit = async (e) => {
  e.preventDefault();
  const b = document.getElementById('b'), err = document.getElementById('err');
  b.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/login', { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ password: document.getElementById('p').value }) });
    if (res.ok) { location.href = '/'; return; }
    err.textContent = (await res.json()).error || 'Sign-in failed';
  } catch (_) { err.textContent = 'Network error - try again.'; }
  b.disabled = false;
};
</script>
</body>
</html>
